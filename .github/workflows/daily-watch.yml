name: daily-watch

# 平日 07:30 JST（= 前日 22:30 UTC）に保有とウォッチリストを見る
on:
  schedule:
    - cron: "30 22 * * 0-4"
  workflow_dispatch:

concurrency:
  group: daily-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.11
      - run: uv pip install -r requirements.txt
      - name: 監視
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: uv run python scripts/daily_watch.py
      - name: 失敗を通知
        if: failure()
        run: |
          curl -H "Title: dividend-scout 監視失敗" \
               -d "GitHub Actions のログを確認してください" \
               "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
