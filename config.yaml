# dividend-scout 設定
# 閾値・重みはすべてここに集約する。コードに数値を直書きしない。

universe:
  # 対象市場（JPX data_j.xlsx の「市場・商品区分」の値）
  markets:
    - "プライム（内国株式）"
    - "スタンダード（内国株式）"
    - "グロース（内国株式）"
  # 除外業種（銀行・保険は財務指標の意味が違うため別ゲートで扱う）
  financial_sectors:
    - "銀行業"
    - "保険業"
    - "証券、商品先物取引業"
  bulk_batch_size: 100      # yf.download に一度に渡す銘柄数
  price_period: "max"       # 配当履歴を最大限取るため

# ---- ゲート（通らない銘柄はスコア計算すらしない）----
gate:
  min_listing_years: 5
  min_market_cap_oku: 100          # 億円
  min_avg_turnover_man: 3000       # 20日平均売買代金（万円）
  max_dividend_cuts_10y: 1         # 直近10年の減配回数
  # yfinance は銘柄によって3〜5期しか返さない（実測: 4期が605銘柄、3期が9銘柄）。
  # 「5期中4期」と絶対数で書くと、4期しか取れない銘柄が機械的に落ちる。
  # 取れた期数に対する比率で判定する。
  min_positive_ocf_ratio: 0.75     # 営業CFプラスの期数 ÷ 取得できた期数
  min_fiscal_periods: 3            # これ未満は判定不能として除外
  # 財務の足切りは2本立て。自己資本比率30%の一本槍だと通信・鉄道・電力といった
  # 設備産業が丸ごと落ちる（実測: NTT の自己資本比率は 20.8%）。
  # 「自己資本が厚い」か「レバレッジは高いが営業CFで返せる」かのどちらかで通す。
  min_equity_ratio: 0.30           # 自己資本比率（金融を除く）
  min_equity_ratio_leveraged: 0.15 # レバレッジ型の下限
  max_net_debt_to_ocf: 10.0        # ネット有利子負債 ÷ 営業CF（年）
  min_equity_ratio_financial: 0.04 # 金融は別基準
  max_payout_ratio: 0.70
  max_fcf_payout_ratio: 1.00
  max_loss_years_5y: 1
  min_dividend_years: 5            # 配当実績が5年未満は判定不能として除外

# ---- スコア重み ----
# 2026-09-15 の検証（4コホート・延べ9,220銘柄）とヘムの手法を踏まえて設定。
# 検証結果は docs/validation_report_2026-09-15.txt。
weights:
  capacity: 1.5      # A 増配余力  ヘムの選定基準の1番目。割安と組んで初めて意味を持つ
  willingness: 0.5   # B 増配意思  検証で加点としては効かなかった（連続増配上位30社は
                     #             全体平均に負けた）。減配歴はゲート側で効かせている
  growth: 1.0        # C 原資成長  検証不能のため据え置き
  neglect: 1.2       # D 見過ごされ度  弱いが単調（+32%→+46%）。ヘムが優位性と明言する領域
  valuation: 1.5     # E 割安  検証で唯一きれいに単調（+15%→+65%）。ヘムの2番目
  trap_penalty: 1.0  # F 減点の効き具合

scoring:
  payout_ideal_low: 0.30      # 配当性向のスイートスポット
  payout_ideal_high: 0.50
  payout_too_low: 0.15        # これ未満は還元意思なしとして減点
  # ヘムの中核ルール「配当性向 < 配当利回り × 10」を連続値にしたもの。
  # 配当利回り×10 ÷ 配当性向 が 1.0 を超えるとヘム基準を満たす（PER<10 と同値）。
  # ゲートにすると 402 → 53 銘柄まで落ちて情報を捨てるので、加点指標として使う。
  hem_ratio_threshold: 1.0
  yield_percentile_window_years: 7
  dps_cagr_years: [5, 10]

traps:
  extreme_yield: 0.065        # これ超＋52週安値圏は減配織り込みを疑う
  near_low_threshold: 0.15    # 52週レンジ下位15%を「安値圏」とする
  accrual_gap_threshold: 0.30 # 純利益と営業CFの乖離率
  payout_creep_delta: 0.20    # 配当性向が前期比でこれだけ跳ねたら警告
  payout_creep_floor: 0.50    # ただし水準がこれ未満なら余力ありとみなす
  dilution_threshold: 0.03    # 発行済株数の年間増加率
  earnings_slide_years: 2     # 純利益が連続で減った期数

# ---- 買い付け優先度 ----
# 発掘スコア（total）は「市場にまだ気づかれていないか」を含むので、
# 見つけるための順位であって、いま買う順位ではない。
# 限られた資金を配るときは別の式で優劣をつける。
# 優先度 = √(割安度 × 配当継続) × 補完度係数 − トラップ減点
# 加重和にすると「安いが配当が危ない」が上位に来る（実測: 割安95・継続34 の銘柄が
# 加重和69点で上位に入っていた）。両方そろって初めて買う、という性質を式にする。
buy_priority:
  self_yield_weight: 0.6   # 割安度のうち「自己利回り順位」の比率
  abs_yield_weight: 0.4    # 割安度のうち「候補内での絶対利回り順位」の比率
  fit_swing: 0.2           # 補完度による上下の幅（±10%）
  # 足切り（順位を付ける前に外す）
  min_health: 40           # 配当継続スコアがこれ未満なら、安くても買わない
  max_trap_penalty: 10     # 高配当トラップの減点がこれ以上なら買わない
  # 日本株は100株単位。1単元は10万〜70万円が普通なので、「1銘柄あたり入金の15%まで」
  # といった上限をそのまま当てると単元が上限を超える銘柄が全部落ちる（実測: 投入枠
  # 30万円に対して上位25銘柄のうち買えたのは3銘柄、9.9万円しか配れなかった）。
  # 余った資金は、上限を超えても1単元だけ買う2周目で配る。
  single_lot_max: 0.50     # ただし1銘柄が入金のこの割合を超えることはしない
  # 単元未満株（S株・かぶミニ・ワン株）で買うと1株から配れるが、そのままだと
  # 端数で ¥297 のような細切れが1行できる。管理の手間が増えるだけで配当は増えない。
  min_ticket_yen: 3000     # 1銘柄あたりの最低金額
  min_ticket_pct: 0.02     # または入金額のこの割合（大きいほうを採用）
  topup_cap_multiple: 1.5  # 端数を積み増すときに、1銘柄あたりの上限を何倍まで許すか

# ---- 相場の水準と現金の使い方 ----
# ヘムの3本目の柱「暴落時の買い向かい」。現金を残しておき、
# 日経平均PBRが下がるほど多く投入する。
market:
  cash_reserve: 0.30          # 平常時に残しておく現金の割合（総資産に対して）
  # いまの水準で、入金額のうちどれだけ投入してよいか
  regimes:
    - {pbr_below: 0.90, name: "総力戦", deploy: 1.00,
       note: "リーマン級。取ってある現金を全部使う局面"}
    - {pbr_below: 1.10, name: "大人買い", deploy: 1.00,
       note: "歴史的な安値圏。入金額を全額入れたうえで、現金も取り崩す"}
    - {pbr_below: 1.35, name: "買い増し", deploy: 1.00,
       note: "安い。入金額は全額入れてよい"}
    - {pbr_below: 1.60, name: "平常", deploy: 0.80,
       note: "ふつうの水準。入金額の8割を入れ、残りは現金に積む"}
    - {pbr_below: 1.90, name: "やや高い", deploy: 0.60,
       note: "やや高い。入金額の6割にとどめ、現金を厚くする"}
    - {pbr_below: 99.0, name: "高い", deploy: 0.40,
       note: "高い。入金額の4割にとどめ、暴落に備えて現金を貯める"}
  # 大人買いライン（日経平均PBRが下がったら、取ってある現金のうち何割を入れるか）
  ladder:
    - {pbr: 1.40, deploy: 0.10}
    - {pbr: 1.30, deploy: 0.15}
    - {pbr: 1.20, deploy: 0.15}
    - {pbr: 1.10, deploy: 0.20}
    - {pbr: 1.00, deploy: 0.20}
    - {pbr: 0.90, deploy: 0.10}
    - {pbr: 0.80, deploy: 0.10}

# ---- 売る基準 ----
# 【買わない理由と、売る理由は別物】
# 以前は新規買いのゲートをそのまま流用していた。実測すると保有114銘柄のうち84銘柄が
# 「重大」になり、中身は「銀行の営業CFがマイナス」「トヨタのFCFが配当に足りない」
# 「配当性向がデータ欠損」といった、売る理由になっていないものばかりだった。
# 買うときは選択肢が3,700あるので厳しくてよいが、売るのは税金・スプレッド・
# 再投資先の確保というコストを払う行為なので、**壊れたという事実にだけ反応させる**。
sell:
  # 🔴 売却を検討（配当そのものが壊れた）
  cuts_10y_serious: 3          # 10年でこの回数以上の減配は「景気で配当を動かす会社」
  payout_unsustainable: 1.00   # 利益を超えて配当している
  payout_grace_streak: 10      # ただし連続増配がこの年数以上なら一時的とみなす
  # 🟡 監視を強める（原資が傷んでいる）※ 金融業には当てない
  neg_ocf_years: 2             # 営業CFマイナスが連続した期数
  loss_years: 2                # 最終赤字が連続した期数
  net_debt_to_ocf_danger: 15.0 # ネット有利子負債 ÷ 営業CF（年）
  equity_ratio_danger: 0.20    # 上と同時に満たしたときだけ発火させる
  earnings_slide_years: 2      # 純利益の連続減益
  payout_watch: 0.60           # 減益と重なったときに警告する配当性向
  health_danger: 30            # 配当継続スコアがこれ未満＋減配歴ありで警告
  flat_dps_years: 3            # 配当すえ置きが続いた年数
  flat_payout_floor: 0.50      # すえ置き＋この性向超で「増配余地なし」
  # 🟢 利確を検討（ヘムの「上がりすぎたら売る」）
  rich_yield_percentile: 0.15  # 自己利回り順位がこれ以下＝歴史的に株価が高い
  rich_min_gain: 0.30          # 含み益がこれ以上あるときだけ提案する
  rich_per: 15.0               # ヘムの利確目安
  # PERで見る分岐には自己利回り順位の条件を必ず重ねる。これが無いと
  # 「もともと低利回りの銘柄」を全部拾う（実測: JR東日本は自己利回り順位87%＝
  # 自分史上いちばん安い水準なのに「上がりすぎた」と出ていた）。
  rich_yield_percentile_loose: 0.50
  rich_yield_vs_target: 0.60   # 現在利回りが目標のこの倍率を下回ったら
  # ⚪️ 手入れ（売り理由ではない）
  tiny_position: 0.003         # 全体に占める割合がこれ未満

# ---- 自動更新（毎週1本だけ走らせ、古いものだけ追加でやる）----
# 「毎週土曜」「毎月1日」「毎年7月」と別々に登録すると、その日に Mac が落ちていたら
# 1年ぶんまるごと飛ぶ。毎週走らせて「何日前か」で判断すれば、2週間落ちていても
# 次に起きたときに足りないぶんが埋まる。
schedule:
  profiles_days: 30        # 会社の基本情報：これ以上たっていたら取り直す
  edinet_days: 180         # 有価証券報告書：これ以上たっていたら取り直す
  # ただし取りに行くのは7月以降。3月期決算の有報は6月下旬に集中して出るので、
  # それより前に行っても去年のものしか無い。
  edinet_from_month: 7

portfolio:
  tax_rate_specific: 0.20315  # 特定口座
  tax_rate_nisa: 0.0
  max_sector_weight: 0.20     # 33業種ベースの上限（目安表示用）

paths:
  db: "data/scout.db"
  legacy_dir: "../portfolio-manager/data"
